name: Web-App auf GitHub Pages veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PWA_AUTH_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Godot installieren
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Web-App exportieren
        run: |
          mkdir -p web
          godot --headless --path . --export-release Web web/index.html

      - name: Update-Information für Windows erzeugen
        shell: bash
        run: |
          VERSION="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Meine-Budgetwelt-Setup-${VERSION}.exe"
          SHA256_URL="${DOWNLOAD_URL%.exe}.sha256"
          printf '{\n  "version": "%s",\n  "download_url": "%s",\n  "sha256_url": "%s"\n}\n' \
            "$VERSION" "$DOWNLOAD_URL" "$SHA256_URL" > web/update-manifest.json

      - name: Cache-sicheren Versionslink erzeugen
        shell: bash
        run: |
          VERSION="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)"
          TEMP_WEB="$(mktemp -d)"
          cp -a web/. "${TEMP_WEB}/"
          mkdir -p "web/v${VERSION}"
          cp -a "${TEMP_WEB}/." "web/v${VERSION}/"

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Web-Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
