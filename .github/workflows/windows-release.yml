name: Windows-Version veröffentlichen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Godot installieren
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Version prüfen
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)"
          if [ -z "$VERSION" ]; then
            echo "Keine Version in project.godot gefunden."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu Version ${VERSION}."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Windows-App exportieren
        shell: bash
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" \
            "build/windows/Meine-Budgetwelt-${{ steps.version.outputs.version }}.exe"

      - name: NSIS installieren
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes nsis

      - name: Windows-Installer erzeugen
        shell: bash
        run: |
          makensis -WX \
            -DAPP_VERSION="${{ steps.version.outputs.version }}" \
            -DAPP_EXE="${GITHUB_WORKSPACE}/build/windows/Meine-Budgetwelt-${{ steps.version.outputs.version }}.exe" \
            -DOUTPUT_FILE="${GITHUB_WORKSPACE}/build/windows/Meine-Budgetwelt-Setup-${{ steps.version.outputs.version }}.exe" \
            installer/meine-budgetwelt.nsi

      - name: SHA-256-Prüfsumme erzeugen
        shell: bash
        run: |
          cd build/windows
          sha256sum "Meine-Budgetwelt-Setup-${{ steps.version.outputs.version }}.exe" \
            > "Meine-Budgetwelt-Setup-${{ steps.version.outputs.version }}.sha256"

      - name: Update-Manifest erzeugen
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Meine-Budgetwelt-Setup-${VERSION}.exe"
          SHA256_URL="${DOWNLOAD_URL%.exe}.sha256"
          printf '{\n  "version": "%s",\n  "download_url": "%s",\n  "sha256_url": "%s"\n}\n' \
            "$VERSION" "$DOWNLOAD_URL" "$SHA256_URL" \
            > build/windows/update-manifest.json

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Meine Budgetwelt ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/windows/Meine-Budgetwelt-Setup-${{ steps.version.outputs.version }}.exe
            build/windows/Meine-Budgetwelt-Setup-${{ steps.version.outputs.version }}.sha256
            build/windows/update-manifest.json
