name: Windows-Version veröffentlichen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Godot installieren
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true

      - name: Version prüfen
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)"
          if [ -z "$VERSION" ]; then
            echo "Keine Version in project.godot gefunden."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu Version ${VERSION}."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Windows-App exportieren
        shell: bash
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" \
            "build/windows/Budget-und-Wocheneinkauf-${{ steps.version.outputs.version }}.exe"

      - name: SHA-256-Prüfsumme erzeugen
        shell: bash
        run: |
          cd build/windows
          sha256sum "Budget-und-Wocheneinkauf-${{ steps.version.outputs.version }}.exe" \
            > "Budget-und-Wocheneinkauf-${{ steps.version.outputs.version }}.sha256"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Meine Budgetwelt ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            build/windows/Budget-und-Wocheneinkauf-${{ steps.version.outputs.version }}.exe
            build/windows/Budget-und-Wocheneinkauf-${{ steps.version.outputs.version }}.sha256
